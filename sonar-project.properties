# SonarQube Cloud analysis, run by the "Build and test" job of
# .github/workflows/ci.yml after the tests (Automatic Analysis must be off).
sonar.projectKey=dihedron_lxd-spiffe
sonar.organization=dihedron
sonar.projectName=lxd-spiffe
sonar.sourceEncoding=UTF-8

# Go code and the lab's scripts; tests apart. Recorded evidence and fixtures
# are data, not code; generated protobuf code is not ours to analyse.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,docs/validation/**,test/fixtures/**,evidence/**,dist/**,**/testdata/**,**/*.pb.go

# coverage of "go test ./... -coverprofile=coverage.txt" in the same job
sonar.go.coverage.reportPaths=coverage.txt

# Two shell style rules that do not fit the lab scripts' conventions: bash
# functions there return their last command's status (an explicit return on
# every function would hide it), and use $1, $2 directly where the function
# is a few lines long; both are ignored for shell scripts only.
sonar.issue.ignore.multicriteria=sh1,sh2,jwt1,jwt2,tls1,tls2,prof
sonar.issue.ignore.multicriteria.sh1.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.sh1.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.sh2.ruleKey=shelldre:S7679
sonar.issue.ignore.multicriteria.sh2.resourceKey=**/*.sh

# Reviewed false positives, kept here rather than as comments in the code
# (an edited line no longer matches the dismissals other tools hold):
# - the probe decodes bearer tokens without verifying them on purpose: it
#   records their claims or checks their format, and LXD verifies them;
sonar.issue.ignore.multicriteria.jwt1.ruleKey=go:S5659
sonar.issue.ignore.multicriteria.jwt1.resourceKey=internal/probe/server/bearer.go
sonar.issue.ignore.multicriteria.jwt2.ruleKey=go:S5659
sonar.issue.ignore.multicriteria.jwt2.resourceKey=internal/probe/server/session.go
# - the probe's TLS 1.2 handshake is pinned (PinMatch), only observes which
#   TLS versions LXD accepts and sends nothing; CodeQL's alert on the same
#   line is dismissed with this reason (FR-S17 (1));
sonar.issue.ignore.multicriteria.tls1.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.tls1.resourceKey=internal/lxd/handshake.go
sonar.issue.ignore.multicriteria.tls2.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.tls2.resourceKey=internal/lxd/handshake.go
# - profiling is opt-in: off unless the operator sets <BINARY>_CPU_PROFILE
#   or <BINARY>_MEM_PROFILE, which needs control of the process environment.
sonar.issue.ignore.multicriteria.prof.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.prof.resourceKey=cmd/*/init.go
