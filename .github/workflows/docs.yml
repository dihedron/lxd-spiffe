name: Documents

# Builds the release documents on every change that can affect them, so
# that a document that does not build is caught before a release, and
# attaches the PDFs to the run for review. Releases build them again, with the release version
# (make release). See .specs/lxd-spire-plugins.md.

on:
  push:
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # git describe stamps the version

      - name: Build the documents
        run: docs/build.sh

      - name: Attach the documents to the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documents
          path: build/docs/*.pdf
          if-no-files-found: error
