# GitGuardian: the lab's evidence and fixtures are left out of its scans.
#
# They hold public values that look like secrets to a generic high-entropy
# detector: the SHA-256 fingerprints of lab client certificates that LXD
# reports as auth_user_name in GET /1.0, and bearer identity UUIDs. GitGuardian
# can only ignore exact values or paths, and every lab session creates new
# identities, so the trees are ignored as a whole. They have stricter controls
# of their own: every lab session runs "lxd-probe util sanitize --check"
# before collecting, and the CI's gitleaks scan (.gitleaks.toml) covers them
# with a narrow allowlist for exactly these values.
version: 2
secret:
  ignored_paths:
    - docs/validation/**
    - test/fixtures/**
