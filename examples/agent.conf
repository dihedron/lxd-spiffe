# SPIRE Agent configuration fragment enabling the lxd_iid node attestor
# (merge into the plugins block of agent.conf).
#
# The plugin is a stub: it has no settings yet, and every attestation fails
# until the mechanism is specified in .specs/lxd-spire-plugins.md.

plugins {
  NodeAttestor "lxd_iid" {
    plugin_cmd      = "/usr/bin/lxd-agent-plugin"
    # SHA-256 of the installed binary (make checksum): SPIRE refuses to load
    # a binary whose hash does not match
    plugin_checksum = "<sha256 of the installed binary>"
    plugin_data {
    }
  }
}
