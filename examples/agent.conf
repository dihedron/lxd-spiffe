# SPIRE Agent configuration fragment enabling the lxd_iid node attestor
# (merge into the plugins block of agent.conf). The Setup Guide describes
# every key; the values below are the defaults unless the comment says
# otherwise. SPIRE Agent must run as root.

plugins {
  NodeAttestor "lxd_iid" {
    plugin_cmd      = "/usr/bin/lxd-agent-plugin"
    # SHA-256 of the installed binary (sha256sum /usr/bin/lxd-agent-plugin):
    # SPIRE refuses to load a binary whose hash does not match
    plugin_checksum = "<sha256 of the installed binary>"
    plugin_data {
      claim {
        # not a default: the guest cannot learn its project, so name it
        project       = "spire-nodes"
        # empty: the name devLXD reports, else the hostname
        instance_name = ""
      }
      # auto | required | off
      use_devlxd          = "auto"
      devlxd_socket       = "/dev/lxd/sock"
      # the server plugin's proof_dir: the two must match
      proof_dir           = "/run/spire/lxd"
      # how long the proof stays after the answer (at least the server's)
      proof_timeout       = "15s"
      # the whole attestation; longer when many agents share one address
      attestation_timeout = "30s"
    }
  }
}
