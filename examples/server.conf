# SPIRE Server configuration fragment enabling the lxd_iid node attestor
# (merge into the plugins block of server.conf). The Setup Guide describes
# every key; the values below are the defaults unless the comment says
# otherwise.

plugins {
  NodeAttestor "lxd_iid" {
    plugin_cmd      = "/usr/bin/lxd-server-plugin"
    # SHA-256 of the installed binary (sha256sum /usr/bin/lxd-server-plugin):
    # SPIRE refuses to load a binary whose hash does not match
    plugin_checksum = "<sha256 of the installed binary>"
    plugin_data {
      # the agent's SPIFFE ID path, after spiffe://<trust domain>/spire/agent/
      agent_path_template = "{{ .PluginName }}/{{ .ServerID }}/{{ .InstanceUUID }}"
      # file_pull | config_push | auto
      proof_mode    = "file_pull"
      # how long the server waits for the proof (a VM's lxd-agent may need 90s)
      proof_timeout = "10s"
      # the agent plugin's proof_dir: the two must match
      proof_dir     = "/run/spire/lxd"
      # allow | deny: may an attested agent attest again
      reattest      = "allow"

      policy {
        allow_privileged = false
        # not a default: no key is denied unless listed
        deny_config_keys = ["raw.lxc", "raw.idmap"]
      }

      # one entry per LXD server or cluster; the key is its server_id, part
      # of every SPIFFE ID it issues
      servers = {
        "lxd-prod" = {
          url                     = "https://lxd.example.org:8443"
          client_cert_file        = "/etc/spire/lxd/client.crt"
          # readable by its owner only (0400 or 0600)
          client_key_file         = "/etc/spire/lxd/client.key"
          # on LXD 6.x, instead of the client certificate:
          # bearer_token_file     = "/etc/spire/lxd/bearer.token"
          # lxc info | grep certificate_fingerprint, or ca_bundle_file
          server_cert_fingerprint = "sha256:<64 hex digits>"
          projects                = ["spire-nodes"]
        }
      }

      selectors {
        enable      = ["server", "uuid", "project", "type", "privileged", "profile", "network"]
        config_keys = []
        user_keys   = []
      }

      limits {
        max_inflight      = 16
        rate_per_sec      = 20
        failure_cooldown  = "5s"
        breaker_threshold = 5
        breaker_open      = "5s"
        breaker_max_open  = "60s"
      }
    }
  }
}
